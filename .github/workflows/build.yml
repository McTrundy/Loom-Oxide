name: Patch and Build

on:
  push:
    branches: [ "ver/**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Build only the active version on pushes and avoid duplicate same-repository pull request runs.
    if: ${{ (github.event_name != 'push' || github.ref_name == github.event.repository.default_branch) && (github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Configure Git User Details
        run: git config --global user.email "actions@github.com" && git config --global user.name "Github Actions"
      - name: Record Build Metadata
        id: metadata
        shell: bash
        run: |
          echo "build_number=${GITHUB_RUN_NUMBER}" >> "${GITHUB_OUTPUT}"
          echo "build_started_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "${GITHUB_OUTPUT}"
      - name: Verify and Build
        env:
          BUILD_NUMBER: ${{ steps.metadata.outputs.build_number }}
          BUILD_STARTED_AT: ${{ steps.metadata.outputs.build_started_at }}
        run: ./scripts/verify-ci.sh
      - name: Build and Check Native Noise
        shell: bash
        run: |
          docker build -t loom-oxide-rust native/noise
          docker run --rm --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$PWD,dst=/workspace" \
            --workdir /workspace/native/noise -e CARGO_HOME=/tmp/oxide-cargo \
            loom-oxide-rust sh -c 'cargo fmt --check && cargo clippy --locked --all-targets -- -D warnings && cargo test --locked && cargo build --release --locked'
          ./scripts/verify-native-noise.sh
      - name: Package Build
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mc_version="$(sed -n 's/^mcVersion=//p' gradle.properties)"
          jar_path="$(find loom-server/build/libs -maxdepth 1 -type f -name 'loom-paperclip-*.jar' -print -quit)"
          test -n "${jar_path}"

          mkdir -p artifacts
          build_name="loom-mc${mc_version}-build.${GITHUB_RUN_NUMBER}.jar"
          cp "${jar_path}" "artifacts/${build_name}"

          echo "artifact_name=loom-mc${mc_version}-build.${GITHUB_RUN_NUMBER}" >> "${GITHUB_OUTPUT}"
      - name: Upload Build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: artifacts/loom-mc*-build.*.jar
          if-no-files-found: error
