def oxideBackend = System.getProperty('oxide.test.backend')
def oxideLibrary = System.getProperty('oxide.test.library')
if (!(oxideBackend in ['ffm', 'jffi']) || !oxideLibrary) {
    throw new GradleException('Set oxide.test.backend=ffm|jffi and oxide.test.library to the built library')
}

gradle.projectsEvaluated {
    gradle.rootProject.project(':loom-server').tasks.named('test', Test) {
        setIncludes(['net/minecraft/world/level/levelgen/synth/OxideNoiseTestSuite.class'])
        systemProperty 'loom.oxide.noiseBackend', oxideBackend
        systemProperty 'loom.oxide.nativeLibrary', oxideLibrary
        inputs.file(oxideLibrary).withPropertyName('oxideNativeLibrary').withPathSensitivity(PathSensitivity.NONE)
        jvmArgs '--enable-native-access=ALL-UNNAMED'
        def parityReport = reports.junitXml.outputLocation.file('TEST-net.minecraft.world.level.levelgen.synth.OxideNoiseTestSuite.xml').get().asFile
        def backendReport = project.layout.buildDirectory.file("test-results/native-noise/${oxideBackend}.xml").get().asFile
        doLast {
            def report = new groovy.xml.XmlSlurper().parse(parityReport)
            if (report.@tests.text() != '1' || report.@skipped.text() != '0' ||
                report.@failures.text() != '0' || report.@errors.text() != '0') {
                throw new GradleException("Native parity suite did not execute successfully for ${oxideBackend}")
            }
            backendReport.parentFile.mkdirs()
            java.nio.file.Files.copy(parityReport.toPath(), backendReport.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
    }
}
